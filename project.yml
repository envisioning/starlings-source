name: Starlings
options:
  bundleIdPrefix: com.starlingshq
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  postGenCommand: |
    scripts/version-env.sh --write-xcconfig
    scripts/configure-xcode-scheme.sh
  # Icon Composer packages must be a single file ref, not exploded folders.
  fileTypes:
    icon:
      file: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Meet is Apple Silicon-only. Keep every locally built target on arm64;
    # the packaging step also thins prebuilt framework slices before signing.
    ARCHS: arm64
    # Off so version-env.sh can run git and write Config/Version.xcconfig from
    # Xcode build phases (sandbox blocks git + writes outside DerivedData).
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    # Keep every target aligned with Xcode's linker recommendation. AppKit
    # selectors are referenced statically, so no Meet entry points rely on
    # runtime-only discovery that dead stripping could remove.
    DEAD_CODE_STRIPPING: YES
    # Generate type-safe Image/Color accessors for the shared asset catalog.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    # The app's accent is the lime, not the system blue (meet#140 follow-up):
    # this is what NSPopUpButton, NSSwitch, table selection and SwiftUI's
    # `Color.accentColor` inside hosted views draw with. macOS honours it
    # while the person's System Settings accent is Multicolor; a picked
    # system accent wins there by design, which is why every Meet-drawn
    # selection still names EnvisioningAccent explicitly.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Generate type-safe symbols for manually managed String Catalog entries.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # One String Catalog for every target (Resources/Localizable.xcstrings,
    # meet#245 step 2). The compiler extracts every SwiftUI `Text("…")`,
    # every `String(localized:)` and every literal handed to a
    # `String.LocalizationValue` parameter into it on build; pt-BR entries
    # are added there, never in code.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # DEVELOPMENT_TEAM, the signing switch, the production host and the Google
    # client IDs live in Config/Starlings.xcconfig and its overlay. Setting them
    # here would override both, because project settings win over a project
    # xcconfig.
    # MARKETING_VERSION / CURRENT_PROJECT_VERSION live only in
    # Config/Version.xcconfig (scripts/version-env.sh). Setting them here would
    # override the xcconfig and freeze CFBundleVersion at a literal.
    CODE_SIGN_IDENTITY: Apple Development
    # The app's bundle ID (meet#735). Every target's is this plus a suffix,
    # and the App Group is `group.` plus this. The same value is
    # NATIVE_APP_BUNDLE_ID in packages/contracts/src/native-app.ts (what the
    # Swift code and the Worker read) and STARLINGS_BUNDLE_ID in
    # scripts/app-names.sh (the release scripts): change all three together.
    STARLINGS_BUNDLE_ID: com.starlingshq.app
configFiles:
  Debug: Config/Starlings.xcconfig
  Release: Config/Starlings.xcconfig
packages:
  # The shared Envisioning layer: the mark, Octa, the accent and its rule.
  # Resolved from GitHub, not a sibling directory: a relative path only builds on
  # a machine with both repos checked out side by side, so CI and anyone else
  # cannot. Tracks main rather than a tag, because two apps are still shaping
  # this package and a pin would strand whichever one is not cutting it.
  #
  # The cost is real and worth knowing: a package edit now has to be committed
  # and pushed before either app sees it — and pushing is not always enough,
  # because a stale SPM checkout outlives a correct Package.resolved. See
  # landmine 16 in AGENTS.md before concluding the package is behind.
  EnvisioningUI:
    url: https://github.com/envisioning/envisioning-ui.git
    branch: main
  # Core's registry-driven CRM — the data layer and the entity screens — so
  # Work can show everything in Core, not only the projects and leads the
  # Worker projects. Same branch-tracking trade-off as EnvisioningUI, same
  # landmine.
  CoreKit:
    url: https://github.com/envisioning/core-kit.git
    branch: main
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.5
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.16.0
  # The Swift side of packages/contracts: wire types generated from the zod
  # schemas by `pnpm contracts:gen`. Local path, because it is this repo's own
  # output and must move in the same commit as the schema it came from.
  StarlingsContracts:
    path: packages/contracts/swift
targets:
  Starlings-CLI:
    type: tool
    platform: macOS
    sources:
      - path: CLI
      - path: Sources/StarlingsCLIProtocol.swift
      # The socket's folder and the app's bundle ID (meet#797).
      - path: Sources/AppFolders.swift
      - path: Sources/Generated/SharedConstantsRegistry.swift
    dependencies:
      - package: StarlingsContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STARLINGS_BUNDLE_ID).cli
        PRODUCT_NAME: starlings
        # Not `starlings`: on a case-insensitive disk that module would take
        # the path of the app's `Starlings.swiftmodule` in Build/Products.
        PRODUCT_MODULE_NAME: StarlingsCommandLine
    preBuildScripts:
      # A build folder made before 2026-10-20 holds the CLI's old
      # `starlings.swiftmodule`. The app's `Starlings.swiftmodule` lands in it,
      # and `@testable import Starlings` then fails to resolve. Remove only the
      # lowercase folder; the app's own folder has a capital S.
      - name: Drop stale starlings.swiftmodule
        basedOnDependencyAnalysis: false
        script: |
          if ls "${BUILT_PRODUCTS_DIR}" 2>/dev/null | grep -qx 'starlings.swiftmodule'; then
            rm -rf "${BUILT_PRODUCTS_DIR}/starlings.swiftmodule"
          fi
  Starlings:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Starlings.xcconfig
      Release: Config/Starlings.xcconfig
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        type: folder
        buildPhase: resources
      # The one String Catalog, shared by every target (meet#245).
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      # Permission reasons differ on Mac and iOS; each bundle owns its table.
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
      - path: Resources/Flags
        type: folder
        buildPhase: resources
      - path: Resources/starlings.icon
        buildPhase: resources
      # Two knuckle raps, played when somebody knocks on this room. Synthesised
      # rather than sampled — see scripts/make-knock-sound.py. It has to land
      # flat in Contents/Resources: both NSSound and UNNotificationSound look it
      # up by bare name, and a folder reference would hide it.
      - path: Resources/Sounds/knock.wav
        buildPhase: resources
      # A wave from a colleague, and the room noticing you arrive. Same flat
      # placement and the same reason as the knock — see the note above and
      # scripts/make-wave-sound.py / scripts/make-welcome-sound.py.
      - path: Resources/Sounds/wave.wav
        buildPhase: resources
      - path: Resources/Sounds/welcome.wav
        buildPhase: resources
      # The shared Upcoming knobs are also imported by the Worker and web.
      - path: packages/contracts/src/upcoming-config.json
        buildPhase: resources
      # The Docs graph's limits, folder palette and layout are shared with web.
      - path: packages/contracts/src/docs-graph-config.json
        buildPhase: resources
      # App cannot replace its own bundle while running — the script quits,
      # verifies notarization + Team ID (STARLINGS_TEAM_ID in the Info.plist),
      # ditto's into /Applications, reopens.
      # See docs/UPDATER.md.
      - path: scripts/update-app.sh
        buildPhase: resources
    dependencies:
      - target: Starlings-CLI
      - package: EnvisioningUI
      - package: CoreKit
        product: CoreKit
      - package: CoreKit
        product: CoreCRMUI
      - package: CoreKit
        product: DocsKit
      - package: CoreKit
        product: DocsUI
      - package: CoreKit
        product: KeepKit
      - package: CoreKit
        product: KeepUI
      - package: FluidAudio
      - package: LiveKit
      - package: StarlingsContracts
      - sdk: IOKit.framework
      - sdk: EventKit.framework
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Starlings
        # The languages the interface ships in (meet#245). The catalog decides
        # what is drawn; this tells the system which to offer in Settings.
        CFBundleLocalizations: [en, pt-BR]
        # Build-setting refs (not literals) so Version.xcconfig / stamp scripts win.
        # Must stay strings — Metal's telemetry path crashes on NSNumber versions.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSCameraUsageDescription: Starlings uses your camera so people in your meeting can see you.
        # Opt into Continuity Camera's dedicated device type so DiscoverySession
        # can list iPhone cameras separately from the built-in FaceTime camera.
        NSCameraUseContinuityCameraDeviceType: true
        # Opt into Continuity Camera / Control Center video effects for this process.
        # Portrait, Studio Light, and Background Replacement stay user-controlled;
        # Center Stage can also be toggled from the app in cooperative mode.
        NSCameraPortraitEffectEnabled: true
        NSCameraStudioLightEnabled: true
        NSCameraReactionEffectsEnabled: true
        NSCameraReactionEffectGesturesEnabledDefault: false
        # Required by ContactEmailDirectory's CNContactStore.requestAccess (attendee
        # suggestions in the schedule sheet). macOS terminates the app on that call
        # when the key is absent, so it travels with the feature — not optional copy.
        NSContactsUsageDescription: Starlings uses Contacts to suggest attendees when you schedule a meeting.
        NSCalendarsUsageDescription: Starlings shows your iCloud and On My Mac calendars in the Calendar window. Event details stay on this Mac.
        NSCalendarsFullAccessUsageDescription: Starlings shows your iCloud and On My Mac calendars in the Calendar window. Event details stay on this Mac.
        NSMicrophoneUsageDescription: Starlings uses your microphone so people in your meeting can hear you and to provide live captions.
        NSScreenCaptureUsageDescription: Starlings uses Screen Recording access to share the screen or window you choose with people in your meeting.
        # The system-audio grant for ambient capture (docs/AMBIENT_CAPTURE.md).
        # Without this string macOS never asks and the tap delivers silence.
        NSAudioCaptureUsageDescription: Starlings captures the audio of a meeting you are in so it can write the notes. Nothing is recorded; the audio is transcribed on this Mac and discarded.
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        MEET_API_ENDPOINT: "$(MEET_API_ENDPOINT)"
        MEET_WEB_ORIGIN: "$(MEET_WEB_ORIGIN)"
        MEET_ALLOW_DEV_AUTH: "$(MEET_ALLOW_DEV_AUTH)"
        MEET_GOOGLE_NATIVE_CLIENT_ID: "$(MEET_GOOGLE_NATIVE_CLIENT_ID)"
        MEET_GOOGLE_REDIRECT_SCHEME: "$(MEET_GOOGLE_REDIRECT_SCHEME)"
        # UpdateCheck.swift and update-app.sh read these from the bundle.
        STARLINGS_UPDATE_FEED_URL: "$(STARLINGS_UPDATE_FEED_URL)"
        STARLINGS_TEAM_ID: "$(DEVELOPMENT_TEAM)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(STARLINGS_BUNDLE_ID).oauth
            CFBundleURLSchemes:
              - "$(MEET_GOOGLE_REDIRECT_SCHEME)"
    settings:
      base:
        # Not an `entitlements:` block: XcodeGen would write that path over this
        # setting, and the overlay must choose the file. Both copies are kept by
        # hand. Not App Sandboxed since 3.8.3 (docs/AMBIENT_CAPTURE.md): reading
        # who is speaking in a Zoom window needs the Accessibility grant, which
        # the sandbox does not allow. Hardened runtime stays, and the file holds
        # its resource-access declarations; each still prompts through TCC: audio
        # input, camera, Contacts for the schedule sheet's guest autocomplete
        # (emails only, never logged), and EventKit for the Calendar window.
        #
        # The overlay's copy adds associated domains, for Keep's passkeys. A
        # restricted entitlement: it only launches with a provisioning profile
        # that grants it. Xcode's automatic signing embeds a Mac development
        # profile (this Mac, your account); build-app.sh strips the key on both
        # of its paths until a Developer ID profile with Associated Domains
        # exists (docs/KEEP.md). So build-app.sh signs with the public file.
        CODE_SIGN_ENTITLEMENTS: $(STARLINGS_ENTITLEMENTS_DIR)/Starlings.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(STARLINGS_BUNDLE_ID)
        # Starlings.app: the file, CFBundleName, the Dock and the app switcher
        # (meet#797). The Swift module is Starlings too.
        PRODUCT_NAME: Starlings
        PRODUCT_MODULE_NAME: Starlings
        # Meet ships for Apple Silicon only; do not produce an Intel slice.
        ARCHS: arm64
        # Not sandboxed since 3.8.3: Accessibility (reading Zoom's window for
        # who is speaking) is not available to a sandboxed app. Hardened
        # runtime stays; the entitlements file carries the resource grants.
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: starlings
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: YES
          MEET_ALLOW_DEV_AUTH: YES
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          MEET_ALLOW_DEV_AUTH: NO
    preBuildScripts:
      - name: Refresh Version.xcconfig
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/scripts/version-env.sh" --write-xcconfig'
    postCompileScripts:
      - name: Stamp Apple version
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/scripts/version-env.sh" --stamp-product'
  StarlingsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # The shared upcoming-tier table, read by UpcomingTierFixtureTests. The
      # TypeScript suite reads the same file from the repo.
      - path: fixtures/upcoming-tiers.json
        buildPhase: resources
      # What a timed calendar tile says under its title (meet#610), read by
      # CalendarTileFixtureTests. The web suite reads the same file.
      - path: fixtures/calendar-tile.json
        buildPhase: resources
      # The background gallery's drawing rule (meet#862), read by
      # BackgroundGalleryFixtureTests. The web suite reads the same file.
      - path: fixtures/background-gallery.json
        buildPhase: resources
      # The meeting warning (meet#239), read by MeetingAlertFixtureTests on
      # both targets.
      - path: fixtures/meeting-alerts.json
        buildPhase: resources
      # Quick add (meet#235), read by QuickAddFixtureTests on both targets;
      # the Worker's suite reads the same file.
      - path: fixtures/quick-add.json
        buildPhase: resources
      # The shared work-order table, read by WorkItemFixtureTests. Same
      # arrangement as the upcoming tiers: the TypeScript suite reads the very
      # same file from the repo.
      - path: fixtures/work-items.json
        buildPhase: resources
      # The shared Home order, read by HomeLayoutFixtureTests. Same arrangement.
      - path: fixtures/home-layout.json
        buildPhase: resources
      # The shared search rule, read by SearchFixtureTests. Same arrangement.
      - path: fixtures/search-rows.json
        buildPhase: resources
      # The shared Docs graph behavior and runtime settings, read by both ports.
      - path: fixtures/docs-graph.json
        buildPhase: resources
      - path: packages/contracts/src/docs-graph-config.json
        buildPhase: resources
      # Goals and decisions (meet#261, #262), read by GoalsDecisionsFixtureTests.
      - path: fixtures/goals-decisions.json
        buildPhase: resources
      # Who answers for a subject, read by ResponsibleFixtureTests.
      - path: fixtures/responsible.json
        buildPhase: resources
      # The transcript name pass (meet#155), read by TranscriptNameLexiconTests.
      - path: fixtures/transcript-names.json
        buildPhase: resources
      # The per-user subject-state rule, read by SubjectStateFixtureTests.
      # The Worker's suite reads the same file.
      - path: fixtures/subject-state.json
        buildPhase: resources
      # How a subject row reads, read by WorkRowFixtureTests on both targets.
      - path: fixtures/work-rows.json
        buildPhase: resources
      # The task-row action registry, shared by native clients and the web port.
      - path: fixtures/work-actions.json
        buildPhase: resources
      - path: fixtures/subject-kinds.json
        buildPhase: resources
      - path: fixtures/subject-context.json
        buildPhase: resources
      - path: fixtures/subject-status.json
        buildPhase: resources
      - path: fixtures/lead-qualification.json
        buildPhase: resources
      - path: fixtures/form-fields.json
        buildPhase: resources
      # The request policy both clients read, read by RequestPolicyFixtureTests (meet#597).
      - path: fixtures/request-policy.json
        buildPhase: resources
      - path: fixtures/calendar-keys.json
        buildPhase: resources
      - path: fixtures/team-rail.json
        buildPhase: resources
      - path: fixtures/work-ranker.json
        buildPhase: resources
      - path: fixtures/browse-groups.json
        buildPhase: resources
      - path: fixtures/work-modules.json
        buildPhase: resources
      - path: fixtures/rail-blocks.json
        buildPhase: resources
      - path: fixtures/settings-pages.json
        buildPhase: resources
      # The setup checklist's steps (docs/ONBOARDING.md), read by SetupStepsFixtureTests.
      - path: fixtures/setup-steps.json
        buildPhase: resources
      # Shared cross-client rule cases, read by RuleFixtureTests on both targets
      # and by the web suite.
      - path: fixtures/docs-slug.json
        buildPhase: resources
      - path: fixtures/participant-initials.json
        buildPhase: resources
      - path: fixtures/thread-markdown.json
        buildPhase: resources
      - path: fixtures/subject-query.json
        buildPhase: resources
      - path: fixtures/contact-query.json
        buildPhase: resources
      # Mention-recipient boundaries across native and web (#1065).
      - path: fixtures/mention-matching.json
        buildPhase: resources
      # A transcript as a file and a link (meet#692), read by RuleFixtureTests.
      - path: fixtures/transcript-export.json
        buildPhase: resources
      # Which destinations a client lists (meet#982), read by RuleFixtureTests.
      - path: fixtures/surface-visibility.json
        buildPhase: resources
      - path: fixtures/workspace-defaults.json
        buildPhase: resources
      # starlings's same-user socket contract, compared against generated types.
      - path: fixtures/cli-wire.json
        buildPhase: resources
      # Guest entry route responses, decoded by generated native wire models.
      - path: fixtures/room-entry.json
        buildPhase: resources
      # The colour roles all three surfaces share (meet#599), read by
      # SurfaceMirrorTests. The web suite and MobileColorTokensTests read the same file.
      - path: fixtures/color-tokens.json
        buildPhase: resources
      # What the Worker really answers (meet#593): the bodies its route tests
      # recorded, decoded by ResponseFixtureTests. The web and the Worker read
      # the same folder.
      - path: fixtures/responses
        type: folder
        buildPhase: resources
    dependencies:
      - target: Starlings
      - package: StarlingsContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STARLINGS_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        # Pins the workspace the tests read (Tests/HostedTestWorkspace.swift).
        INFOPLIST_KEY_NSPrincipalClass: StarlingsTests.HostedTestWorkspace
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Starlings.app/Contents/MacOS/Starlings"
        BUNDLE_LOADER: "$(TEST_HOST)"
  Starlings-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Starlings.xcconfig
      Release: Config/Starlings.xcconfig
    sources:
      - path: iOS
      # App Store privacy manifest (meet#328): UserDefaults (own + App
      # Group), system uptime (face centering), file attributes (FluidAudio
      # model files), and the data the app sends to the Worker.
      - path: Config/Privacy/iOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The one String Catalog, shared by every target (meet#245).
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/iOS/InfoPlist.xcstrings
        buildPhase: resources
      # The calendar core is shared verbatim with the Mac app: value types, week
      # math, the EventKit reader, the control-plane wire, and the workspace that
      # owns state and writes. Only the views are per-platform. Anything AppKit
      # the calendar needs lives in Sources/CalendarAppKitChrome.swift, which is
      # deliberately absent from this list.
      - path: Sources/CalendarBackend.swift
      # Last launch's months on disk, so a cold start paints the week it knew
      # instead of an empty grid. Shared for the same reason the workspace is.
      - path: Sources/CalendarEventCache.swift
      - path: Sources/SnapshotStore.swift
      - path: Sources/CalendarLayer.swift
      - path: Sources/Generated/CalendarValuesRegistry.swift
      - path: Sources/CalendarModels.swift
      - path: Sources/StarlingsSemanticColors.swift
      - path: Sources/CalendarSettings.swift
      # Booking hours' defaults, limits and words (meet#1009); the views are per platform.
      - path: Sources/BookingHours.swift
      - path: Sources/SettingsRegistry.swift
      - path: Sources/Generated/SettingsPagesRegistry.swift
      # The setup checklist's steps (docs/ONBOARDING.md); Home draws them on both clients.
      - path: Sources/Generated/SetupStepsRegistry.swift
      - path: Sources/SetupChecklist.swift
      - path: Sources/StarlingsAppearance.swift
      # The language the interface is drawn in, owner-synced (meet#245).
      - path: Sources/StarlingsLanguage.swift
      - path: Sources/Generated/SharedConstantsRegistry.swift
      # The folders the app writes and their names before the rename (meet#797).
      - path: Sources/AppFolders.swift
      # The Starlings wordmark and its flock, drawn from the registry the web
      # draws too. Shared so first run and About read the same table.
      - path: Sources/StarlingsWordmark.swift
      - path: Sources/StarlingsGlyph.swift
      - path: Sources/Generated/GatheringDotsRegistry.swift
      - path: Sources/StarlingsDateFormatting.swift
      # Whether Home draws its grid. Shared so the Mac launch surface and the
      # iOS Home tab cannot disagree about what the setting is called or what
      # it defaults to; the saved value stays per device.
      - path: Sources/HomeTexturePreferences.swift
      # And the lattice itself: one definition of the pitch, the baked
      # variation, the seed and the motion timings, so Home reads the same on
      # both clients.
      - path: Sources/HomeGridLattice.swift
      - path: Sources/CalendarWire.swift
      - path: Sources/ContractsExtensions.swift
      - path: Sources/OwnerAccessToken.swift
      - path: Sources/GoalsDecisions.swift
      # Who answers for a subject (docs/OWNERSHIP.md), shared with the Mac.
      - path: Sources/Responsible.swift
      # The follow-up's mail draft (meet#756), shared with the Mac.
      - path: Sources/FollowUpMail.swift
      - path: Sources/MeetingPlatformMarkGeometry.swift
      - path: Sources/CalendarWindowPreferences.swift
      - path: Sources/CalendarWorkspace.swift
      - path: Sources/ChatModels.swift
      # Direct-message wire types. Shared so a thread means the same thing in
      # the Mac window and on the phone.
      - path: Sources/DirectMessages.swift
      # One `@mention` grammar for both clients — see MentionMatching.swift.
      - path: Sources/MentionMatching.swift
      # Whether a channel notifies on every message or only on a mention.
      # Shared so the setting means the same thing on both; saved per device.
      - path: Sources/MessageNotificationPreferences.swift
      # How a transcript is arranged for reading — where a day starts, where the
      # reader left off, which lines are one person speaking once. Shared for
      # the same reason the wire types are: a conversation that groups
      # differently on two screens is a conversation nobody trusts. The web
      # answers to the same rules in web/src/conversation-model.ts.
      - path: Sources/ThreadTranscript.swift
      # And what a message is written in. One Markdown subset for the Mac, the
      # phone and the browser (web/src/markdown.tsx), so a reply cannot render
      # three ways. The AppKit renderer beside it stays out of this target.
      - path: Sources/ThreadMarkdown.swift
      # Which email domains count as Envisioning. Identity has to mean the
      # same thing on the phone, on the Mac, and in the Worker.
      - path: Sources/EnvisioningIdentity.swift
      # Which workspace this install signs in to, and its mark (meet#903).
      # Shared so the phone and the Mac read a workspace the same way.
      - path: Sources/StarlingsWorkspace.swift
      - path: Sources/StarlingsWorkspaceViews.swift
      - path: Sources/WorkspaceMarkVector.swift
      # Sign-in through the workspace's own web sign-in (meet#726), the
      # same attempt and callback rules on both clients.
      - path: Sources/WorkspaceSignIn.swift
      # Add a workspace (meet#1038): the flow and its lookup line, shared
      # by the iPhone sheet and the Mac sheet.
      - path: Sources/AddWorkspaceFlow.swift
      - path: Sources/AddWorkspaceViews.swift
      # The door's workspace rows and Enter an address (meet#1169).
      - path: Sources/WorkspaceDoorViews.swift
      # Which workspace a room link belongs to, and the link carried across
      # a change of workspace (meet#728).
      - path: Sources/WorkspaceLinks.swift
      # What a sign-out of one workspace, or of all, clears on the device
      # (meet#903).
      - path: Sources/WorkspaceSignOut.swift
      # The workspace's accent shades, read from its descriptor (meet#717).
      - path: Sources/WorkspaceAccent.swift
      # What one workspace's Keychain items, caches and queue are filed
      # under (meet#725), the same on both clients.
      - path: Sources/WorkspaceScope.swift
      - path: Sources/EventKitCalendarStore.swift
      - path: Sources/ISODate.swift
      - path: Sources/LocalMeetingTranscriber.swift
      - path: Sources/MicrophoneProcessing.swift
      - path: Sources/MeetingArtifactOutbox.swift
      # The outbox's retry edge: network back (and wake on the Mac), meet#329.
