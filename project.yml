    dependencies:
      - package: EnvisioningUI
      - package: CoreKit
        product: CoreKit
      - package: CoreKit
        product: CoreCRMUI
      - package: CoreKit
        product: DocsKit
      - package: CoreKit
        product: DocsUI
      - package: CoreKit
        product: KeepKit
      - package: CoreKit
        product: KeepUI
      - package: FluidAudio
      - package: LiveKit
      - package: StarlingsContracts
      - target: Starlings-Activities
      - target: Starlings-Share
      - target: Starlings-Watch
      - sdk: EventKit.framework
    info:
      path: Config/StarlingsiOS-Info.plist
      properties:
        # The languages the interface ships in (meet#245); this is also what
        # makes iOS offer Meet its own language row in Settings.
        CFBundleLocalizations: [en, pt-BR]
        # Lock Screen / Dynamic Island countdown to the next meeting. The
        # extension renders it; this key is what lets the app request one.
        NSSupportsLiveActivities: true
        CFBundleDisplayName: Starlings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.business
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Starlings uses your camera so people in your meeting can see you, and to take photos and scans for messages.
        NSMicrophoneUsageDescription: Starlings uses your microphone so people in your meeting can hear you, and to record voice messages.
        NSContactsUsageDescription: Starlings uses Contacts to suggest people when you schedule a meeting.
        # The Calendar tab reads iCloud / on-device calendars through EventKit,
        # alongside Google. Event details stay on this device.
        NSCalendarsUsageDescription: Starlings shows your iCloud and on-device calendars in the Calendar tab. Event details stay on this device.
        NSCalendarsFullAccessUsageDescription: Starlings shows your iCloud and on-device calendars in the Calendar tab, and adds events you create there. Event details stay on this device.
        NSLocalNetworkUsageDescription: Starlings can connect to your development meeting service on the local network.
        # Optional app lock (Settings > App lock). Without this key iOS kills the
        # app the first time it asks for Face ID.
        NSFaceIDUsageDescription: Starlings uses Face ID to unlock the app when you turn on the app lock.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        MEET_API_ENDPOINT: "$(MEET_API_ENDPOINT)"
        MEET_WEB_ORIGIN: "$(MEET_WEB_ORIGIN)"
        MEET_GOOGLE_NATIVE_CLIENT_ID: "$(MEET_GOOGLE_NATIVE_CLIENT_ID)"
        MEET_GOOGLE_REDIRECT_SCHEME: "$(MEET_GOOGLE_REDIRECT_SCHEME)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(STARLINGS_BUNDLE_ID).oauth
            CFBundleURLSchemes:
              - "$(MEET_GOOGLE_REDIRECT_SCHEME)"
          # `starlings://event/<reference>`: a glance surface opening a
          # meeting that has no link (meet#184, `StarlingsGlance.eventURL`).
          # Widgets, Live Activities and notifications write `starlings://`
          # only; `meet://` stays registered for the ones written before the
          # rename (meet#1059), for at least two App Store releases.
          - CFBundleTypeRole: Viewer
            CFBundleURLName: $(STARLINGS_BUNDLE_ID).glance
            CFBundleURLSchemes:
              - starlings
              - meet
    settings:
      base:
        # Kept by hand, as on the Mac target. The App Group: the app writes the
        # agenda there for the Home Screen widget and the controls read the
        # launch action from it; the token never goes there. Same group as the
        # watch bundles. The App ID needs the App Groups capability, so the App
        # Store profile must be regenerated. The overlay's copy adds associated
        # domains, for Keep's passkeys and the https sign-in callback on every
        # workspace host (meet#905); the App ID needs that capability too.
        CODE_SIGN_ENTITLEMENTS: $(STARLINGS_ENTITLEMENTS_DIR)/StarlingsiOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(STARLINGS_BUNDLE_ID)
        PRODUCT_NAME: Starlings
        PRODUCT_MODULE_NAME: Starlings
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: starlings
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "starlings-graphite-accent starlings-graphite-white"
      configs:
        # Debug signs automatically, so it has no specifier.
        Release:
          # scripts/build-ios.sh exports this before running xcodegen; a
          # command-line PROVISIONING_PROFILE_SPECIFIER cannot be used because
          # xcodebuild would apply the app's profile to the extension too. Left
          # unsubstituted on a developer machine, where signing is automatic and
          # the specifier is ignored.
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_APP_STORE_PROFILE_NAME}
    preBuildScripts:
      - name: Refresh Version.xcconfig
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/scripts/version-env.sh" --write-xcconfig'
    postCompileScripts:
      - name: Stamp Apple version
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/scripts/version-env.sh" --stamp-product'
  # WidgetKit extension carrying the meeting Live Activity. It shares only the
  # ActivityKit attributes and the colour table with the app — WidgetKit rejects
  # `Canvas`, so the rest of StarlingsMobileDesign stays app-only.
  # iOS 18, not the app's 17: `supplementalActivityFamilies` (the watchOS 11
  # Smart Stack layout) has no availability-gated form for a
  # `WidgetConfiguration`, and an unavailable `@main` would crash on 17. An
  # iOS 17 phone installs the app and skips this extension — no Live Activity.
  Starlings-Activities:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    configFiles:
      Debug: Config/Starlings.xcconfig
      Release: Config/Starlings.xcconfig
    sources:
      - path: iOSActivities
      # UserDefaults: the App Group launch action and EnvisioningUI's
      # appearance (meet#328).
      - path: Config/Privacy/Activities/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The one String Catalog, shared by every target (meet#245).
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/Extensions/InfoPlist.xcstrings
        buildPhase: resources
      - path: iOS/MeetingActivityAttributes.swift
      # The one shape every glance surface draws (meet#184).
      - path: iOS/StarlingsGlance.swift
      - path: iOS/StarlingsMobileColors.swift
      - path: Sources/StarlingsSemanticColors.swift
      # The next-meeting widget and the controls: the agenda file's shape and
      # reader, the launch-action slot, and the one time formatter.
      - path: iOS/WatchBridge.swift
      # The App Group, the widget kinds and the link scheme (meet#735).
      - path: Sources/Generated/SharedConstantsRegistry.swift
      - path: iOS/AgendaFile.swift
      - path: iOS/LaunchAction.swift
      # The workspace's accent, written by the app (meet#1133).
      - path: iOS/WidgetAccent.swift
      - path: Sources/StarlingsDateFormatting.swift
      # The widget places events the way Home does: the one rule, and the
      # bundled config it reads.
      - path: Sources/MeetingFocus.swift
      - path: Sources/UpcomingConfiguration.swift
      - path: packages/contracts/src/upcoming-config.json
      - path: Resources/Assets.xcassets
    dependencies:
      - package: EnvisioningUI
      - package: StarlingsContracts
    entitlements:
      path: Config/StarlingsiOSActivities.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(STARLINGS_BUNDLE_ID)
    info:
      path: Config/StarlingsiOSActivities-Info.plist
      properties:
        CFBundleLocalizations: [en, pt-BR]
        CFBundleDisplayName: Starlings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STARLINGS_BUNDLE_ID).activities
        PRODUCT_NAME: StarlingsActivities
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          # Its own App Store profile — see the app target's note.
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_ACTIVITIES_APP_STORE_PROFILE_NAME}
    preBuildScripts:
      - name: Refresh Version.xcconfig
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/scripts/version-env.sh" --write-xcconfig'
  # The share extension (docs/DOCS.md, link saves): Save to Docs from
  # Safari's share sheet. Safari runs PageCapture.js and hands over the page's
  # HTML. It has no session and gets none: it writes the page to the App
  # Group outbox (iOS/ShareOutbox.swift) and the app saves it when it is next
  # active. The token never goes there.
  Starlings-Share:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Starlings.xcconfig
      Release: Config/Starlings.xcconfig
    sources:
      - path: iOSShare
        excludes:
          - "*.js"
      - path: iOSShare/PageCapture.js
        buildPhase: resources
      # UserDefaults: the App Group's workspace slot.
      - path: Config/Privacy/Share/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The one String Catalog, shared by every target (meet#245).
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/Extensions/InfoPlist.xcstrings
        buildPhase: resources
      - path: iOS/ShareOutbox.swift
      # The App Group (meet#735).
      - path: Sources/Generated/SharedConstantsRegistry.swift
      # The house field and toolbar buttons. The form is
      # EnvisioningForm itself (StarlingsMobileDesign, which aliases it, draws
      # the app's glyph and needs half the app).
      - path: iOS/StarlingsConcentricDesign.swift
      - path: iOS/StarlingsSingleLineField.swift
      - path: iOS/StarlingsMobileColors.swift
      - path: Sources/StarlingsSemanticColors.swift
      - path: Resources/Assets.xcassets
    dependencies:
      - package: EnvisioningUI
    entitlements:
      path: Config/StarlingsiOSShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(STARLINGS_BUNDLE_ID)
    info:
      path: Config/StarlingsiOSShare-Info.plist
      properties:
        CFBundleLocalizations: [en, pt-BR]
        CFBundleDisplayName: Starlings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: PageCapture
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STARLINGS_BUNDLE_ID).share
        PRODUCT_NAME: StarlingsShare
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          # Its own App Store profile — see the app target's note.
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_SHARE_APP_STORE_PROFILE_NAME}
    preBuildScripts:
      - name: Refresh Version.xcconfig
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/scripts/version-env.sh" --write-xcconfig'
  # The watch app (issue #179). It shares the bridge contract, the lobby wire
  # models and the quick-note wire with the phone, and nothing else: no
  # EnvisioningUI (iOS/macOS only), no StarlingsAPI, no LiveKit. It never hosts,
  # joins, or records.
  Starlings-Watch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    configFiles:
      Debug: Config/Starlings.xcconfig
      Release: Config/Starlings.xcconfig
    sources:
      - path: watchOS
      # UserDefaults for queued quick notes; the notes go to the Worker
      # (meet#328).
      - path: Config/Privacy/Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The one String Catalog, shared by every target (meet#245).
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/Extensions/InfoPlist.xcstrings
        buildPhase: resources
      - path: iOS/WatchBridge.swift
      - path: iOS/AgendaFile.swift
      # `AgendaFile.next` is Home's focus rule (meet#184): the rule, the
      # glance shape it fills, and the bundled config the rule reads.
      - path: iOS/StarlingsGlance.swift
      - path: Sources/MeetingFocus.swift
      - path: packages/contracts/src/upcoming-config.json
      # For `UpcomingPreferencesWire` in the agenda file's shape; the watch
      # passes the defaults and never reads them.
      - path: Sources/UpcomingConfiguration.swift
      - path: Sources/ContractsExtensions.swift
      - path: Sources/Generated/SharedConstantsRegistry.swift
      - path: Sources/QuickNotes.swift
      - path: Sources/ISODate.swift
      - path: Sources/StarlingsDateFormatting.swift
      # The same Icon Composer package the phone uses; it carries a watch layer.
      - path: Resources/starlings.icon
        buildPhase: resources
    dependencies:
      - target: Starlings-WatchWidgets
      - package: StarlingsContracts
    entitlements:
      path: Config/StarlingsWatch.entitlements
      properties:
        # The complication reads the agenda from this group; the token never
        # goes there.
        com.apple.security.application-groups:
          - group.$(STARLINGS_BUNDLE_ID)
    info:
      path: Config/StarlingsWatch-Info.plist
      properties:
        CFBundleLocalizations: [en, pt-BR]
        CFBundleDisplayName: Starlings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(STARLINGS_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STARLINGS_BUNDLE_ID).watchkitapp
        # Xcode 27 builds watchOS for arm64 alone. App Store Connect needs
        # arm64_32 too while the minimum watchOS is below 27 (ITMS-90733;
        # the 6.8.5 upload, 2026-10-10).
        ARCHS: "arm64 arm64_32"
        # Not `Starlings`: the phone app already produces Starlings.app, and a
        # flat products directory would have the two write the same path.
        PRODUCT_NAME: StarlingsWatch
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: starlings
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_WATCH_APP_STORE_PROFILE_NAME}
    preBuildScripts:
      - name: Refresh Version.xcconfig
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/scripts/version-env.sh" --write-xcconfig'
  # The watch complication. Reads meetings from the shared group only.
  Starlings-WatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    configFiles:
      Debug: Config/Starlings.xcconfig
      Release: Config/Starlings.xcconfig
    sources:
      - path: watchOSWidgets
      # No required-reason API and no collected data; the manifest says so
      # (meet#328).
      - path: Config/Privacy/WatchWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The one String Catalog, shared by every target (meet#245).
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/Extensions/InfoPlist.xcstrings
        buildPhase: resources
      - path: iOS/AgendaFile.swift
      - path: Sources/UpcomingConfiguration.swift
      - path: iOS/WatchBridge.swift
      # The App Group, the widget kinds and the link scheme (meet#735).
      - path: Sources/Generated/SharedConstantsRegistry.swift
      - path: Sources/StarlingsDateFormatting.swift
      # Same reason as the watch app: the complication reads Home's rule.
      - path: iOS/StarlingsGlance.swift
      - path: Sources/MeetingFocus.swift
      - path: packages/contracts/src/upcoming-config.json
      # The complications draw the still Starlings glyph.
      - path: Sources/StarlingsGlyph.swift
      - path: Sources/Generated/GatheringDotsRegistry.swift
    dependencies:
      - package: StarlingsContracts
    entitlements:
      path: Config/StarlingsWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(STARLINGS_BUNDLE_ID)
    info:
      path: Config/StarlingsWatchWidgets-Info.plist
      properties:
        CFBundleLocalizations: [en, pt-BR]
        CFBundleDisplayName: Starlings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STARLINGS_BUNDLE_ID).watchkitapp.widgets
        # Xcode 27 builds watchOS for arm64 alone. App Store Connect needs
        # arm64_32 too while the minimum watchOS is below 27 (ITMS-90733;
        # the 6.8.5 upload, 2026-10-10).
        ARCHS: "arm64 arm64_32"
        PRODUCT_NAME: StarlingsWatchWidgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_WATCH_WIDGETS_APP_STORE_PROFILE_NAME}
    preBuildScripts:
      - name: Refresh Version.xcconfig
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/scripts/version-env.sh" --write-xcconfig'
  Starlings-iOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOSTests
      # The test workspace's member domains, the same as the Worker's test config.
      - path: Tests/TestWorkspace.swift
      # The fixed-reply URL stub the session-renewal tests share (meet#332).
      - path: Tests/SessionRenewalStub.swift
      # The shared transport's tests, the same on both clients (meet#331).
      - path: Tests/StarlingsHTTPTransportTests.swift
      # Native error classification and the offline spool are shared by both clients (meet#417).
      - path: Tests/StarlingsOperationalErrorTests.swift
      - path: Tests/StarlingsUpgradeRecommendationTests.swift
      # Guest entry uses the generated room and booking projections.
      - path: Tests/RoomEntryContractFixtureTests.swift
      - path: fixtures/room-entry.json
        buildPhase: resources
      # Run the shared table here too: it is the only thing that would notice
      # Sources/MeetingFocus.swift falling out of the iOS target.
      - path: Tests/UpcomingTierFixtureTests.swift
      - path: fixtures/upcoming-tiers.json
        buildPhase: resources
      # The meeting warning's table, the same on both schedulers (meet#239).
      - path: Tests/MeetingAlertFixtureTests.swift
      - path: Tests/MeetingAlertFixtureRunner.swift
      - path: fixtures/meeting-alerts.json
        buildPhase: resources
      # Quick add's table, the same grammar on both parsers (meet#235).
      - path: Tests/QuickAddFixtureTests.swift
      - path: fixtures/quick-add.json
        buildPhase: resources
      # Same reason: the only thing that would notice Sources/WorkItems.swift
      # falling out of the iOS target.
      - path: Tests/WorkItemFixtureTests.swift
      - path: fixtures/work-items.json
        buildPhase: resources
      # Same again for Sources/HomeLayout.swift.
      - path: Tests/HomeLayoutFixtureTests.swift
      - path: fixtures/home-layout.json
        buildPhase: resources
      # Same again for Sources/GoalsDecisions.swift.
      - path: Tests/GoalsDecisionsFixtureTests.swift
      - path: fixtures/goals-decisions.json
        buildPhase: resources
      # Same again for Sources/Responsible.swift.
      - path: Tests/ResponsibleFixtureTests.swift
      - path: fixtures/responsible.json
        buildPhase: resources
      # Same again for Sources/Search.swift.
      - path: Tests/SearchFixtureTests.swift
      - path: fixtures/search-rows.json
        buildPhase: resources
      # Same again for Sources/SubjectState.swift.
      - path: Tests/SubjectStateFixtureTests.swift
      - path: fixtures/subject-state.json
        buildPhase: resources
      - path: Tests/WorkRowFixtureTests.swift
      - path: fixtures/work-rows.json
        buildPhase: resources
      - path: Tests/AttentionQuestionStateTests.swift
      - path: Tests/WorkRowActionFixtureTests.swift
      - path: fixtures/work-actions.json
        buildPhase: resources
      - path: fixtures/subject-kinds.json
        buildPhase: resources
      # A subject's context blocks, the same table on both clients (meet#570).
      - path: Tests/SubjectContextFixtureTests.swift
      - path: fixtures/subject-context.json
        buildPhase: resources
      - path: Tests/SubjectStatusFixtureTests.swift
      - path: fixtures/subject-status.json
        buildPhase: resources
      - path: Tests/LeadQualificationFixtureTests.swift
      - path: fixtures/lead-qualification.json
        buildPhase: resources
      - path: Tests/FormFieldsFixtureTests.swift
      - path: fixtures/form-fields.json
        buildPhase: resources
      - path: Tests/RequestPolicyFixtureTests.swift
      - path: fixtures/request-policy.json
        buildPhase: resources
      - path: Tests/CalendarKeysFixtureTests.swift
      - path: fixtures/calendar-keys.json
        buildPhase: resources
      - path: Tests/TeamRailFixtureTests.swift
      - path: fixtures/team-rail.json
        buildPhase: resources
      - path: Tests/WorkRankerFixtureTests.swift
      - path: fixtures/work-ranker.json
        buildPhase: resources
      - path: Tests/BrowseGroupsFixtureTests.swift
      - path: fixtures/browse-groups.json
        buildPhase: resources
      - path: Tests/RailBlocksFixtureTests.swift
      - path: fixtures/rail-blocks.json
        buildPhase: resources
      - path: Tests/SettingsPagesFixtureTests.swift
      - path: fixtures/settings-pages.json
        buildPhase: resources
      - path: Tests/SetupStepsFixtureTests.swift
      - path: fixtures/setup-steps.json
        buildPhase: resources
      # Shared cross-client rule cases, read by RuleFixtureTests and the web suite.
      - path: Tests/RuleFixtureTests.swift
      - path: fixtures/docs-slug.json
        buildPhase: resources
      - path: fixtures/participant-initials.json
        buildPhase: resources
      - path: fixtures/thread-markdown.json
        buildPhase: resources
      - path: fixtures/subject-query.json
        buildPhase: resources
      - path: fixtures/contact-query.json
        buildPhase: resources
      # Mention-recipient boundaries across native and web (#1065).
      - path: fixtures/mention-matching.json
        buildPhase: resources
      - path: fixtures/transcript-export.json
        buildPhase: resources
      # Which destinations a client lists (meet#982), read by RuleFixtureTests.
      - path: fixtures/surface-visibility.json
        buildPhase: resources
      - path: fixtures/workspace-defaults.json
        buildPhase: resources
      # The colour roles all three surfaces share (meet#599); the loader is shared with the Mac.
      - path: Tests/ColorTokenFixture.swift
      - path: fixtures/color-tokens.json
        buildPhase: resources
      # The Worker's recorded responses (meet#593), decoded with the models this app compiles.
      - path: Tests/ResponseFixtureTests.swift
      - path: Tests/StarlingsWorkspaceDefaultsTests.swift
      - path: fixtures/responses
        type: folder
        buildPhase: resources
    dependencies:
      - target: Starlings-iOS
      - package: StarlingsContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STARLINGS_BUNDLE_ID).ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Starlings.app/Starlings"
        BUNDLE_LOADER: "$(TEST_HOST)"

# Scheme names are the target names. The app product is Starlings.app
# (meet#797). The Swift module and every product name say Starlings too
# (MZ, 2026-10-20).
#
# Run and Profile default to Release with the debugger detached, so what gets
# tried by hand is what ships. Test stays on Debug: a Release configuration
# turns ENABLE_TESTABILITY off and `@testable import` stops resolving.
schemes:
  Starlings:
    build:
      targets: {Starlings: all}
    run: {config: Release, debugEnabled: false}
    test:
      config: Debug
      targets: [StarlingsTests]
    profile: {config: Release}
    analyze: {config: Release}
    archive: {config: Release}
  Starlings-iOS:
    build:
      targets: {Starlings-iOS: all}
    run: {config: Release, debugEnabled: false}
    test:
      config: Debug
      targets: [Starlings-iOSTests]
    profile: {config: Release}
    analyze: {config: Release}
    archive: {config: Release}
  Starlings-Activities:
    build:
      targets: {Starlings-Activities: all}
    run: {config: Release, debugEnabled: false}
    profile: {config: Release}
    analyze: {config: Release}
    archive: {config: Release}
  Starlings-CLI:
    build:
      targets: {Starlings-CLI: all}
    run: {config: Release, debugEnabled: false}
    profile: {config: Release}
    analyze: {config: Release}
    archive: {config: Release}
